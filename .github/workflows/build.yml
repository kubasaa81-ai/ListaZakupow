name: Zbuduj APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Rozpakuj projekt
        run: unzip -q ListaZakupow.zip
      - name: Zbuduj APK
        working-directory: ListaZakupow
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ListaZakupow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ListaZakupow-apk
          path: ListaZakupow.apk

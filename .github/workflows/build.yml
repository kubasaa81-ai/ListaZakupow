name: Zbuduj APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rozpakuj projekt
        run: unzip -q -o ListaZakupow.zip
      - name: Zbuduj APK
        working-directory: ListaZakupow
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          java -version
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ListaZakupow.apk
      - uses: actions/upload-artifact@v5
        with:
          name: ListaZakupow-apk
          path: ListaZakupow.apk
